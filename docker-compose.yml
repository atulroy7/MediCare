version: '3.8'

services:
  medicare-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare_fullstack
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/medicare}
      - JWT_SECRET=${JWT_SECRET:-medicare_jwt_secret_production_key_2026}
      - CLIENT_URL=*
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
